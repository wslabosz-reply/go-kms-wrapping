name: Run integration test on pull request comment
on:
  issue_comment:
    types: [created]
  
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-permissions:
    if: github.event.issue.pull_request && github.event.issue.state == 'open' && contains(github.event.comment.body, '/integration')
    runs-on: ubuntu-slim
    outputs:
      type: ${{ steps.evaluate.outputs.type }}
      commit_sha: ${{ steps.evaluate.outputs.commit_sha }}
    steps:
    - name: Evaluate user permission
      id: evaluate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const allowedTypes = ['aws', 'azure', 'gcp', 'ovh'];
          const body = context.payload.comment.body.trim();
          const user = context.payload.comment.user.login;
          const prNumber = context.payload.issue.number;

          try {
            const { data } = await github.rest.teams.getMembershipForUserInOrg({
              org: 'openbao',
              team_slug: 'openbao-org-maintainers',
              username: user,
            });
            
            if (data.state !== 'active') {
              core.setFailed(`@${user} is not a part of openbao-org-maintainers group.`);
              return;
            }
          } catch (err) {
            // placeholder for testing
            if (user !== 'wslabosz-reply') {
              core.setFailed(`@${user} is not authorized to trigger CI runs.`);
              return;
            }
          }

          const match = body.match(/^\/integration\s+(\S+)\s+([0-9a-fA-F]{40})\s*$/);
          if (!match) {
            core.setFailed('Comment does not match command syntax.');
            return;
          }

          const [, type, commitSha] = match;

          if (!allowedTypes.includes(type)) {
            core.setFailed(`Invalid type \`${type}\`. Allowed: ${allowedTypes.join(', ')}`);
            return;
          }

          core.setOutput('type', type);
          core.setOutput('commit_sha', commitSha);

  run-integration-test:
    needs: validate-permissions
    runs-on: ubuntu-latest

    concurrency:
      group: ci-${{ needs.validate-permissions.outputs.type }}-${{ github.ref }}
      cancel-in-progress: true
    
    steps:
    # TOCTOU protection: confirm commit_sha is part of this PR's history or has landed on main.
    - name: Verify commit belongs to PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const commitSha = '${{ needs.validate-permissions.outputs.commit_sha }}';
          const prNumber = context.payload.issue.number;

          const commits = await github.paginate(github.rest.pulls.listCommits, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          });

          const found = commits.some((c) => c.sha === commitSha);
          let partOfMain = false;
          if (!found) {
            const main = context.payload.repository.default_branch;
            try {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${main}...${commitSha}`,
              });
              partOfMain = data.status === 'identical' || data.status === 'behind';
            } catch (err) {
              partOfMain = false;
            }
          }

          if (!found || !partOfMain) {
            core.setFailed(`Commit ${commitSha} not in PR history nor already on main.`);
          }

    - name: Bump comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          await github.rest.reactions.createForIssueComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            comment_id: context.payload.comment.id,
            content: "+1",
          });

    - name: Checkout reviewed commit with provided sha
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate-permissions.outputs.commit_sha }}

    - name: Map directory to integration test
      id: map
      run: |
        case "${{ needs.validate-permissions.outputs.type }}" in
          aws) echo "dir=./wrappers/awskms" >> "$GITHUB_OUTPUT" ;;
          azure) echo "dir=./wrappers/azurekeyvault" >> "$GITHUB_OUTPUT" ;;
          gcp) echo "dir=./wrappers/gcpckms" >> "$GITHUB_OUTPUT" ;;
          ovh) echo "dir=./wrappers/ovhkms" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.map.outputs.dir }}/go.mod
        cache-dependency-path: ${{ steps.map.outputs.dir }}/go.mod

    - name: Run ${{ steps.map.outputs.dir }} integration test 
      working-directory: ${{ steps.map.outputs.dir }}
      env:
        KMS_ACC_TESTS: true
      run: go test ./...

    - name: Comment with integration test run link
      if: always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          try {
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const type = '${{ needs.validate-permissions.outputs.type }}';
            const commitSha = '${{ needs.validate-permissions.outputs.commit_sha }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Integration test (\`${type}\`) for commit \`${commitSha}\`: [View integration test run](` + runUrl + `)`
            });
          } catch (err) {
            core.warning(`Failed to post comment: ${err.message}`); 
          }
      